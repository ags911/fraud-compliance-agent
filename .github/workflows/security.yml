name: Security

# Dependency advisories are published after code merges, so these checks run on
# every change and again weekly against the default branch. They are automated
# review support, not a security guarantee: this is a synthetic showcase, not a
# production payment or compliance service.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:17 UTC. Off the hour so the run is not queued with everyone
    # else's midnight cron.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Known advisories against what the applications actually ship. Dependabot
  # (see .github/dependabot.yml) proposes the upgrades; this job is the gate
  # that fails a change which introduces or keeps a vulnerable dependency.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # The exported set is the API's runtime dependency tree from the
      # committed lockfile: no dev tooling and no private SDK, which is what the
      # container image installs. pip-audit is deliberately unpinned, because a
      # vulnerability scanner is only useful when its advisory handling is
      # current; it reads the requirements file and resolves nothing itself.
      - name: Audit the API's runtime dependencies
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            > "${RUNNER_TEMP}/api-runtime-requirements.txt"
          uvx pip-audit \
            --requirement "${RUNNER_TEMP}/api-runtime-requirements.txt" \
            --no-deps \
            --disable-pip \
            --strict \
            --progress-spinner off

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The console ships only its production dependencies to a browser, so
      # those are the gate. Development advisories still surface in the GitHub
      # UI and in Dependabot's pull requests.
      - name: Audit the console's production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high --package-lock-only

  # Static analysis of first-party code. build-mode "none" suits both
  # languages here: the API is interpreted, and the console is analysed from
  # source rather than from a bundle.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Security rules plus the maintainability queries that catch unsafe
          # patterns Ruff's S rules and oxlint do not cover.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
