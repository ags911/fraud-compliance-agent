name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web build
    # Visual baselines are recorded with Chrome on macOS, so the browser tests
    # must run on macOS to keep text rasterisation stable. Its Chrome is
    # preinstalled, so no browser install step is needed.
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:payments-design
      - run: npm run build
      - run: npm run test:payments

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      # The SDK submodule lives in a separate private repository, which the
      # default workflow token cannot read. A read-only deploy key scoped to
      # that one repository fetches it; the key file is removed afterwards.
      - name: Fetch private SDK submodule
        working-directory: .
        env:
          SDK_DEPLOY_KEY: ${{ secrets.ARBIRIS_SDK_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SDK_DEPLOY_KEY" > ~/.ssh/arbiris_sdk
          chmod 600 ~/.ssh/arbiris_sdk
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/arbiris_sdk -o IdentitiesOnly=yes" \
            git -c "url.git@github.com:ags911/arbiris-sdk.git.insteadOf=https://github.com/ags911/arbiris-sdk.git" \
            submodule update --init apps/api/vendor/arbiris-sdk
          rm -f ~/.ssh/arbiris_sdk
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check server
      - run: uv run ruff check ../../notebooks ../../scripts
      - run: uv run ruff check --select D103 server ../../notebooks ../../scripts
      - run: uv run python ../../scripts/validate_notebooks.py
      - run: uv run python -c "from server.main import create_app; app = create_app(); assert app.title == 'Fraud Compliance Agent Console API'"
      - run: if [ -d tests ]; then uv run pytest tests; else echo 'No API-owned tests yet; smoke check completed.'; fi
