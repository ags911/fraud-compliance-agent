name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:payments-design
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:payments

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run python ../../scripts/generate_repository_inventory.py --check
      - run: uv run ruff check server
      - run: uv run ruff check ../../notebooks ../../scripts
      - run: uv run ruff check --select D103 server ../../notebooks ../../scripts
      - run: uv run python ../../scripts/validate_notebooks.py
      - run: uv run python -c "from server.main import create_app; app = create_app(); assert app.title == 'Fraud Compliance Agent Console API'"
      - run: if [ -d tests ]; then uv run pytest tests; else echo 'No API-owned tests yet; smoke check completed.'; fi
