name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web build
    # Visual baselines are recorded with Chrome on macOS, so the browser tests
    # must run on macOS to keep text rasterisation stable. Its Chrome is
    # preinstalled, so no browser install step is needed.
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:payments-design
      - run: npm run build
      - run: npm run test:payments

  api:
    name: API checks
    # Fork pull requests cannot read the deploy-key secret, so this job is skipped
    # for them; the no-SDK job below still runs and covers what a fork can test.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The SDK submodule lives in a separate private repository, which the
      # default workflow token cannot read. A read-only deploy key scoped to
      # that one repository fetches it; the key file is removed afterwards.
      - name: Fetch private SDK submodule
        working-directory: .
        env:
          SDK_DEPLOY_KEY: ${{ secrets.ARBIRIS_SDK_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SDK_DEPLOY_KEY" > ~/.ssh/arbiris_sdk
          chmod 600 ~/.ssh/arbiris_sdk
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/arbiris_sdk -o IdentitiesOnly=yes" \
            git -c "url.git@github.com:ags911/arbiris-sdk.git.insteadOf=https://github.com/ags911/arbiris-sdk.git" \
            submodule update --init apps/api/vendor/arbiris-sdk
          rm -f ~/.ssh/arbiris_sdk
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --extra sdk
      - run: uv run --extra sdk ruff check server
      - run: uv run --extra sdk ruff format --check server tests ../../scripts
      - run: uv run --extra sdk ruff check ../../notebooks ../../scripts
      - run: uv run --extra sdk ruff check --select D103 server ../../notebooks ../../scripts
      - run: uv run --extra sdk python ../../scripts/validate_notebooks.py
      - run: uv run --extra sdk python -c "from server.main import create_app; app = create_app(); assert app.title == 'Fraud Compliance Agent Console API'"
      - run: if [ -d tests ]; then uv run --extra sdk pytest tests; else echo 'No API-owned tests yet; smoke check completed.'; fi

  # What a public visitor gets: a clone with no private SDK and no secrets. The
  # API must still install, start, and pass every test that does not need the SDK.
  api-public:
    name: API checks (no private SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # --frozen skips lockfile validation, which would try to read the absent SDK.
      - run: uv sync --frozen
      - run: uv run --frozen ruff check server
      - run: uv run --frozen ruff format --check server tests ../../scripts
      - run: uv run --frozen pytest tests
