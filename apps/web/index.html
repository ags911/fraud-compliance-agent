<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/averlynx-sliced-a-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/averlynx-sliced-a-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/averlynx-sliced-a-180.png">
<title>Averlynx · Risk Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Risk Console, the app's one page. Its shell (top bar, type scale, LCH
    neutral ramp) came from the Linear "Scenarios" screens; its tab bar and
    card layout started from the Stripe Radar dashboard (stripe.com/gb/radar),
    remapped to this project's synthetic fraud scenarios. It owns its own
    palette below; Radix portals are remapped to it in
    src/console/console-controls-theme.css.
  */
  :root{
    --console-content-width: 1100px;
    /* One inner padding for every card on the page (stat tiles, chart
       cards and their header/body bands, the table card, the benchmark
       disclosure), taken from the stat tiles. */
    --card-pad-y: 12px;
    --card-pad-x: 14px;
    /* True neutral (zero-chroma) ramp, near-black background -- matches the
       Linear-style Insights Dashboard reference's palette instead of the
       mockup's original blue/violet-tinted dark theme (hue 282, chroma
       0.4-0.6 on every one of these). */
    --lch-bg-main:         lch(4 0 0);
    --lch-bg-panel:        lch(8 0 0);
    --lch-bg-hover:        lch(11 0 0);
    --lch-bg-pill:         lch(13 0 0);
    --lch-border:          lch(20 0 0);
    --lch-border-soft:     lch(14 0 0);
    --lch-text-primary:    lch(97 0 0);
    --lch-text-secondary:  lch(65 0 0);
    --lch-text-tertiary:   lch(45 0 0);

    /* The page's one accent (primary button, active tab, focus rings,
       links, selected tile). Currently trialling monochrome: near-white,
       the live app's own dark-mode primary, so PASS/CHALLENGE/HOLD are
       the only colour on the page. Dark label text on it: 17.6:1.
       Signal blue alternative: #4C8DFF / rgba(76,141,255,0.14). */
    --console-accent: #f2f2f2;
    --console-accent-dim: rgba(242,242,242,0.07);
    --console-accent-foreground: #0b0b0b;

    --sev-low: #4cb782;
    --sev-low-dim: rgba(76,183,130,0.14);
    --sev-high: #eb5757;
    --sev-high-dim: rgba(235,87,87,0.14);
    --sev-moderate: #f2c94c;

    --radius-pill: 100px;
    --radius-sm: 6px;
    --radius-md: 10px;

    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height:100%; background: var(--lch-bg-main); color: var(--lch-text-primary); -webkit-font-smoothing: antialiased; }
  body{ display:flex; font-size:13px; line-height:1.35; }
  #console-root{ display:flex; flex:1; min-width:0; }
  #console-root .main{ width:100%; }
  a{ color:inherit; text-decoration:none; }

  /* ---------------- Main ---------------- */

  .main{ flex:1; min-width:0; height:100vh; overflow-y:auto; }

  /* The topbar's own border-bottom runs full-bleed (unlike the tabs' and
     body-grid's, which stop at the content column) -- it's the outermost
     edge of the page chrome, not part of the centered content itself.
     .topbar-inner matches .body-grid's max-width + centering so the brand
     and scenario select still line up with the content column below. */
  /* Sticky inside .main (the page's scroll container). Solid background so
     content scrolls under it; z-index below the drawer and menus (z-50). */
  .topbar{
    position: sticky; top: 0; z-index: 20;
    background: var(--lch-bg-main);
    padding: 18px 0; border-bottom: 1px solid var(--lch-border-soft);
  }
  .topbar-inner{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    max-width: var(--console-content-width); margin: 0 auto; padding: 0 24px;
  }
  /* Logomark + product name only -- this page is a standalone portfolio
     piece, so there's no parent brand for a "Averlynx ›" breadcrumb to
     point back to. Was a separate heading row between the topbar and tabs;
     folded in here so it doesn't stack a third bold line on top of the
     tabs and the section heading. */
  .page-title{
    display:flex; align-items:center; gap:8px;
    font-size:15px; font-weight:500; flex-shrink:0;
  }
  /* The app's own NetworkMark (src/components/averlynx-logo.tsx) is
     currentColor, so it picks up the full-strength text colour here. */
  #console-brand-icon-root{ display:flex; color: var(--lch-text-primary); }
  .title-module{ color: var(--lch-text-primary); font-weight:600; }
  .topbar-actions{ display:flex; align-items:center; gap:8px; }
  .topbar-actions [data-slot="button"]{ height:32px; padding:0 0.875rem; border-radius:9999px; }
  .topbar-actions [data-slot="select-trigger"]{ height:32px; padding:0 0.625rem; }

  /* ---------------- Tabs ---------------- */

  /* Tab bar styled after the Stripe Radar dashboard's own tabs (layout
     only, not colour): the first label sits flush on the content edge,
     each underline is exactly its label's width (no side padding), wider
     gaps between labels, and a hairline track under the whole content
     column with the active underline sitting on top of it. */
  .tabs{
    max-width: var(--console-content-width); margin: 16px auto 0;
    padding: 0 24px;
  }
  .tabs-list{
    display:flex; gap:24px;
    border-bottom: 1px solid var(--lch-border-soft);
  }
  .tab{
    position:relative; flex-shrink:0; display:inline-flex; align-items:center; gap:6px;
    padding: 12px 0 11px; border:0; background:none; font:inherit;
    font-size:13px; font-weight:500; color: var(--lch-text-secondary); cursor:pointer;
  }
  .tab:focus-visible{ outline:2px solid var(--console-accent); outline-offset:2px; border-radius:4px; }
  .tab::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    border-radius:2px; background:transparent;
  }
  /* .active is the frozen static markup; data-state is the live Radix tabs. */
  .tab.active, .tab[data-state="active"]{ color: var(--lch-text-primary); }
  .tab.active::after, .tab[data-state="active"]::after{ background: var(--console-accent); }
  .tab:hover:not(.active):not([data-state="active"]){ color: var(--lch-text-secondary); }
  .tab-count{
    min-width:18px; padding:1px 6px; border-radius:9999px; font-size:10.5px; font-weight:600;
    background: var(--lch-bg-pill); border:1px solid var(--lch-border); color: var(--lch-text-secondary);
    font-variant-numeric: tabular-nums; text-align:center;
  }

  /* One tab's content: every card on it is spaced by the same 10px gap,
     so no card's own margin decides the rhythm. */
  .tab-panel{ display:flex; flex-direction:column; gap:10px; min-width:0; }
  .tab-panel:focus-visible{ outline:none; }
  .tab-panel > *, .tab-panel .console-summary-grid, .tab-panel .chart-card{ margin-bottom:0; }
  .tab-panel .section-sub{ margin-bottom:8px; }
  .panel-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:6px; }
  .panel-toolbar .section-heading{ margin-bottom:2px; }
  .panel-toolbar .section-sub{ margin-bottom:0; font-variant-numeric: tabular-nums; }
  .panel-footnote{ margin-top:4px; color: var(--lch-text-secondary); font-size:11.5px; line-height:1.6; }
  .panel-footnote-label{ margin-right:6px; color: var(--lch-text-primary); font-weight:600; }
  .panel-footnote strong{ color: var(--lch-text-primary); font-weight:500; }
  .panel-footnote code{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11px; color: var(--lch-text-secondary); overflow-wrap:anywhere; }
  .empty-card{
    display:grid; justify-items:start; gap:10px;
    background: var(--lch-bg-panel); border:1px solid var(--lch-border-soft); border-radius: var(--radius-md);
    padding: 28px var(--card-pad-x);
  }
  .empty-card .card-copy{ margin-top:0; max-width:62ch; }
  .empty-card [data-slot="button"]{ height:32px; padding:0 0.875rem; border-radius:9999px; margin-top:4px; }
  .table-scroll{ overflow-x:auto; }
  /* Cases tab (spec 0002): case links, the unsaved tag, filters, paging. */
  .case-link{ color: var(--lch-text-primary); text-decoration: underline; text-decoration-color: var(--lch-border); text-underline-offset: 3px; }
  .case-link:hover{ text-decoration-color: var(--lch-text-secondary); }
  .case-link:focus-visible{ outline:2px solid var(--console-accent); outline-offset:2px; border-radius:2px; }
  .not-saved-pill{
    margin-left:8px; font-family: 'Inter', sans-serif; font-size:10.5px; font-weight:600;
    color: var(--lch-text-secondary); background: var(--lch-bg-pill); border:1px solid var(--lch-border);
    padding:1px 7px; border-radius: var(--radius-pill); white-space:nowrap;
  }
  .case-filters{ display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }
  .case-filters [data-slot="select-trigger"]{ height:30px; padding:0 0.625rem; border-radius:9999px; }
  .table-card-footer{ display:flex; justify-content:center; padding: var(--card-pad-y) var(--card-pad-x); border-top:1px solid var(--lch-border-soft); }
  /* This page resets padding globally, so the shadcn utility padding on the
     outline button cannot win here. Give the paging control the same compact
     pill dimensions as the top-bar actions and empty-state CTA. */
  .table-card-footer .show-more{
    display:inline-flex; align-items:center; justify-content:center;
    height:32px; padding:0 0.875rem; border-radius:var(--radius-pill);
    line-height:1;
  }
  .console-collapsible{ background: var(--lch-bg-panel); border:1px solid var(--lch-border-soft); border-radius: var(--radius-md); overflow:hidden; }
  .console-collapsible > summary{ padding: var(--card-pad-y) var(--card-pad-x); color: var(--lch-text-primary); cursor:pointer; font-size:12.5px; font-weight:600; }
  .console-collapsible > summary:focus-visible{ outline:2px solid var(--console-accent); outline-offset:-2px; }
  .console-collapsible[open] > summary{ border-bottom:1px solid var(--lch-border-soft); }
  .console-collapsible .console-outcome-card{ border:0; border-radius:0; margin:0; background:transparent; }

  /* ---------------- Body layout ---------------- */

  .body-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 32px;
    padding: 24px;
    max-width: var(--console-content-width);
    margin: 0 auto;
  }
  .body-grid > *{ min-width:0; }

  .section-heading{ font-size:14px; font-weight:600; margin-bottom:4px; }
  /* Secondary, not tertiary, grey: supporting copy people need to read has
     to clear WCAG AA (tertiary is ~3.5:1 on this ground). */
  .section-sub{ font-size:12.5px; color: var(--lch-text-secondary); line-height:1.55; margin-bottom:18px; }
  .section-sub a{ color: var(--console-accent); }
  .section-sub a:hover{ text-decoration:underline; }
  /* ---------------- Stat tiles ---------------- */

  .stat-tile{
    background: var(--lch-bg-panel);
    border: 1px solid var(--lch-border-soft);
    border-radius: var(--radius-md);
    padding: var(--card-pad-y) var(--card-pad-x);
    cursor:pointer;
  }
  .stat-tile.selected{ border-color: var(--console-accent); background: var(--console-accent-dim); }
  .stat-label{ display:flex; align-items:center; gap:6px; font-size:12px; color: var(--lch-text-primary); margin-bottom:6px; }
  .stat-tile.selected .stat-label{ color:var(--lch-text-primary); }
  .stat-value{ font-size:20px; font-weight:600; color:var(--lch-text-primary); }
  .stat-detail{ margin-top:5px; color:var(--lch-text-secondary); font-size:11.5px; }

  .console-summary-grid{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); grid-auto-rows:1fr; gap:10px; margin-bottom:10px; }
  .console-summary-grid .stat-tile{ display:flex; flex-direction:column; min-height:104px; }
  .console-summary-grid .stat-detail{ margin-top:auto; }
  .benchmark-grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .card-copy{ margin-top:8px; color:var(--lch-text-secondary); font-size:12.5px; line-height:1.55; }
  .status-error{ margin-top:12px; color:var(--sev-high); font-size:12.5px; }
  .empty-table{ padding:28px 16px; color:var(--lch-text-secondary); text-align:center; }
  .console-chart-card{ margin-bottom:10px; }
  .console-chart-empty{ display:flex; align-items:center; justify-content:center; height:160px; color:var(--lch-text-secondary); font-size:12.5px; }
  /* Decision routing (spec 0006): an EvilCharts Sankey
     (src/components/evilcharts), node labels inside, in a .dark scope.
     Every outcome is drawn, at zero too (see routing-summary.ts). */
  .console-routing{ position:relative; overflow:hidden; border:1px solid var(--lch-border-soft); border-radius:var(--radius-md); background:var(--lch-bg-panel); }
  .console-routing-header{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:10px 16px; padding:var(--card-pad-y) var(--card-pad-x); border-bottom:1px solid var(--lch-border-soft); }
  /* The copy keeps a readable width; on a narrow screen the pills wrap below it. */
  .console-routing-header > div:first-child{ flex:1 1 260px; }
  .console-routing-header .card-copy{ margin-top:4px; }
  .console-routing-pills{ display:flex; flex-shrink:0; align-items:center; gap:6px; }
  /* Display only disclosure (spec 0006 AC 9): hides the moving board without
     stopping the feed. A pill like Risk Console's other buttons, 24px tall to meet
     the minimum target size. */
  .console-routing-toggle{ min-height:24px; padding:0 10px; border:1px solid var(--lch-border); border-radius:var(--radius-pill); background:var(--lch-bg-pill); color:var(--lch-text-secondary); cursor:pointer; font:inherit; font-size:11.5px; font-weight:500; }
  .console-routing-toggle:hover{ color:var(--lch-text-primary); }
  .console-routing-toggle:focus-visible{ outline:2px solid var(--console-accent); outline-offset:2px; }
  .console-routing-body.is-collapsed .console-routing-footer{ margin-top:0; }
  .console-routing-empty{ padding:var(--card-pad-y) var(--card-pad-x); color:var(--lch-text-secondary); font-size:12.5px; }
  .console-routing-body{ padding:14px var(--card-pad-x) 12px; }
  .console-routing-chart{ height:220px; }
  .console-routing-footer{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; margin-top:10px; color:var(--lch-text-secondary); font-size:11.5px; font-variant-numeric:tabular-nums; }
  .console-routing-footer strong{ color:var(--lch-text-primary); font-weight:500; }
  .console-routing-sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  /* Current session recommendations -- the Rules Performance card's
     structure (header, distribution bar, legend toggles, stacked chart,
     data disclosure; src/components/rules-performance-chart.tsx) in this
     page's LCH palette. See src/console/ConsoleRecommendationChart.tsx. */
  .chart-card.console-outcome-card{ padding:0; overflow:hidden; }
  .console-outcome-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:18px; padding: var(--card-pad-y) var(--card-pad-x); border-bottom:1px solid var(--lch-border-soft); }
  .console-range-toggle{ display:flex; flex-shrink:0; gap:2px; padding:2px; background:var(--lch-bg-hover); border:1px solid var(--lch-border-soft); border-radius:8px; }
  .console-range-option{ height:27px; min-width:38px; padding:0 8px; border-radius:6px; color:var(--lch-text-secondary); cursor:pointer; font:inherit; font-size:12px; font-weight:500; }
  .console-range-option:hover:not(.is-active){ color:var(--lch-text-primary); }
  .console-range-option.is-active{ background:var(--lch-bg-pill); color:var(--lch-text-primary); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.4); }
  .console-range-option:focus-visible{ outline:2px solid var(--console-accent); outline-offset:1px; }
  .console-outcome-header .card-copy{ margin-top:5px; }
  .console-outcome-title-row{ display:flex; align-items:center; gap:8px; }
  .console-outcome-title-row .card-title{ margin-bottom:0; }
  /* Neutral, not .active-pill's green: a data-source label, not a status. */
  .console-source-pill{
    font-size:10.5px; font-weight:600; color: var(--lch-text-secondary);
    background: var(--lch-bg-pill); border: 1px solid var(--lch-border);
    padding: 1px 8px; border-radius: var(--radius-pill);
  }
  .console-outcome-body{ padding: var(--card-pad-y) var(--card-pad-x); }
  .console-outcome-distribution-wrap{ position:relative; }
  .console-outcome-distribution{ display:flex; height:9px; overflow:hidden; border-radius:var(--radius-pill); background:var(--lch-bg-hover); }
  .console-outcome-distribution-segment{ display:block; height:100%; min-width:0; border:0; cursor:pointer; }
  .console-outcome-distribution-segment + .console-outcome-distribution-segment{ box-shadow:-1px 0 0 var(--lch-bg-panel); }
  .console-outcome-distribution-segment:focus-visible{ outline:2px solid var(--console-accent); outline-offset:2px; }
  .console-outcome-tooltip{
    min-width:150px; padding:10px; white-space:nowrap; font-size:12px; font-variant-numeric:tabular-nums;
    background:var(--lch-bg-pill); border:1px solid var(--lch-border); border-radius:var(--radius-sm);
    color:var(--lch-text-primary); box-shadow:0 4px 16px rgba(0,0,0,0.35);
  }
  .console-outcome-tooltip-floating{ position:absolute; bottom:17px; z-index:10; width:max-content; min-width:0; }
  .console-outcome-tooltip-title{ margin-bottom:6px; font-weight:600; }
  .console-outcome-tooltip-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; line-height:1.7; }
  .console-outcome-tooltip-row strong{ font-weight:600; }
  .console-outcome-tooltip-label{ display:inline-flex; align-items:center; gap:6px; color:var(--lch-text-secondary); }
  .console-outcome-legend{ display:flex; flex-wrap:wrap; gap:7px 16px; margin:11px 0 6px; list-style:none; }
  .console-outcome-toggle{ display:inline-flex; align-items:center; gap:6px; padding:2px 0; color:var(--lch-text-secondary); cursor:pointer; font:inherit; font-size:12px; }
  .console-outcome-toggle[aria-pressed="false"]{ opacity:0.42; text-decoration:line-through; }
  .console-outcome-name{ font-weight:600; }
  .console-outcome-swatch{ width:8px; height:8px; flex-shrink:0; border-radius:2px; }
  .console-outcome-count{ color:var(--lch-text-tertiary); font-variant-numeric:tabular-nums; }
  .console-chart-data{ border:1px solid var(--lch-border-soft); border-radius:var(--radius-sm); margin-top:12px; overflow:hidden; }
  .console-chart-data summary{ color:var(--lch-text-secondary); cursor:pointer; font-size:12px; padding:10px 12px; }
  .console-chart-data[open] summary{ border-bottom:1px solid var(--lch-border-soft); }
  .console-chart-data table{ width:100%; border-collapse:collapse; font-size:12px; }
  .console-chart-data th, .console-chart-data td{ padding:8px 12px; text-align:left; }
  .console-chart-data th{ color:var(--lch-text-tertiary); font-weight:500; }
  .console-chart-data th + th, .console-chart-data td + td{ text-align:right; font-variant-numeric:tabular-nums; }
  .console-chart-data tbody tr + tr{ border-top:1px solid var(--lch-border-soft); }
  .console-chart-data-note{ padding:8px 12px 10px; border-top:1px solid var(--lch-border-soft); color:var(--lch-text-tertiary); font-size:11.5px; }

  /* ---------------- Charts ---------------- */

  .chart-card{
    background: var(--lch-bg-panel);
    border: 1px solid var(--lch-border-soft);
    border-radius: var(--radius-md);
    padding: var(--card-pad-y) var(--card-pad-x);
    margin-bottom: 24px;
    min-width:0;
  }
  /* Per-card title, top-left -- the same convention the Linear-style
     Insights Dashboard reference uses on each of its chart cards ("High-
     Priority Issues by Team", "SLA Success Rate") instead of one heading
     for the whole page. */
  .card-title{ font-size:13px; font-weight:600; margin-bottom:4px; }

  /* ---------------- Review table ---------------- */

  .table-card{
    background: var(--lch-bg-panel);
    border: 1px solid var(--lch-border-soft);
    border-radius: var(--radius-md);
    overflow:hidden;
  }
  .table-card-header{
    display:flex; align-items:center; gap:10px;
    padding: var(--card-pad-y) var(--card-pad-x); border-bottom: 1px solid var(--lch-border-soft);
  }
  .table-card-title{ font-size:13px; font-weight:600; }
  .active-pill{
    font-size:10.5px; font-weight:600; color: var(--sev-low);
    background: var(--sev-low-dim); border: 1px solid rgba(76,183,130,0.3);
    padding: 2px 8px; border-radius: var(--radius-pill);
  }

  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-size:11.5px; font-weight:500; color: var(--lch-text-tertiary);
    padding: 9px var(--card-pad-x); border-bottom: 1px solid var(--lch-border-soft);
  }
  tbody td{ padding: 11px var(--card-pad-x); font-size:12.5px; border-bottom: 1px solid var(--lch-border-soft); }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background: var(--lch-bg-hover); cursor:pointer; }

  .risk-pill{
    display:inline-flex; align-items:center; font-size:11px; font-weight:600;
    padding: 2px 9px; border-radius: var(--radius-pill); border:1px solid;
  }
  .risk-high{ background: var(--sev-high-dim); border-color: rgba(235,87,87,0.3); color: var(--sev-high); }
  .risk-low{ background: var(--sev-low-dim); border-color: rgba(76,183,130,0.3); color: var(--sev-low); }
  .risk-flagged{ background: rgba(242,201,76,0.14); border-color: rgba(242,201,76,0.3); color: var(--sev-moderate); }

  @keyframes pill-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.45; } }
  .risk-pill.pulsing{ animation: pill-pulse 1.6s ease-in-out infinite; }

  .td-mono{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11px; color: var(--lch-text-secondary); }
  .td-scenario{ color: var(--lch-text-primary); font-weight:500; }
  .td-secondary{ color: var(--lch-text-secondary); }
  .td-tertiary{ color: var(--lch-text-tertiary); }

  /* ---------------- Live switch (spec 0003) ---------------- */
  .live-switch{ display:flex; align-items:center; gap:8px; height:32px; padding:0 4px; }
  .live-switch-label{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:500; color: var(--lch-text-secondary); cursor:pointer; }
  .live-switch[data-tone="live"] .live-switch-label{ color: var(--lch-text-primary); }
  .live-switch[data-state="unsupported"] .live-switch-label{ cursor:not-allowed; opacity:0.5; }
  .live-switch [data-slot="switch-thumb"][data-state="unchecked"]{ background: var(--lch-text-secondary); }
  .live-dot{ width:6px; height:6px; border-radius:50%; background: var(--lch-text-tertiary); }
  /* data-tone, not data-state: a quiet automatic failure reads as history (spec 0005). */
  .live-switch[data-tone="live"] .live-dot{ background: var(--sev-low); animation: pill-pulse 1.6s ease-in-out infinite; }
  .live-switch[data-tone="unavailable"] .live-dot{ background: var(--sev-high); }
  .live-switch[data-tone="busy"] .live-dot{ background: var(--sev-moderate); }
  /* A fixed minimum width, so the top bar does not shift as the count changes. */
  .live-status{ min-width:72px; font-size:11.5px; color: var(--lch-text-secondary); font-variant-numeric: tabular-nums; white-space:nowrap; }
  .live-status:empty{ min-width:0; }
  @media (prefers-reduced-motion: reduce){ .live-switch[data-tone="live"] .live-dot{ animation:none; } }
  /* The switch's tooltip: the page's padding reset would strip Tailwind's. */
  .live-switch-hint{ padding: 7px 10px; font-size:12px; line-height:1.5; }

  /* ---------------- Guided tour (spec 0007) ----------------
     driver.js, restyled in this page's palette. The help icon is a square
     ghost button, not a pill. */
  .topbar-actions .console-help-button{ width:32px; padding:0; border-radius:9999px; color: var(--lch-text-secondary); }
  .topbar-actions .console-help-button:hover{ color: var(--lch-text-primary); }
  /* As on Overview: the mask sits below Radix menus (z-index 50), and their
     portalled content takes clicks, so the scenario picker works in step 1. */
  .driver-overlay{ z-index:40 !important; }
  .driver-active [data-radix-popper-content-wrapper],
  .driver-active [data-radix-popper-content-wrapper] *,
  .driver-active [data-slot="select-content"],
  .driver-active [data-slot="select-content"] *{ pointer-events:auto; }
  .driver-active:has([data-slot="select-content"]) .driver-popover.console-tour{ visibility:hidden; }
  .driver-popover.console-tour{
    max-width:300px; padding:14px 16px; border:1px solid var(--lch-border); border-radius: var(--radius-md);
    background: var(--lch-bg-pill); color: var(--lch-text-primary); font-family: inherit;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .console-tour .driver-popover-title{ font-family: inherit; font-size:13.5px; font-weight:600; color: var(--lch-text-primary); }
  .console-tour .driver-popover-description{ margin-top:6px; font-family: inherit; font-size:12.5px; line-height:1.55; color: var(--lch-text-secondary); }
  .console-tour .driver-popover-footer{ margin-top:14px; }
  .console-tour .driver-popover-progress-text{ font-size:11.5px; color: var(--lch-text-secondary); }
  .console-tour .driver-popover-close-btn{ color: var(--lch-text-secondary); }
  .console-tour .driver-popover-close-btn:hover{ color: var(--lch-text-primary); }
  .console-tour .driver-popover-footer button{
    height:28px; padding:0 12px; border:1px solid var(--console-accent); border-radius:9999px;
    background: var(--console-accent); color: var(--console-accent-foreground);
    font-family: inherit; font-size:12px; font-weight:600; text-shadow:none;
  }
  .console-tour .driver-popover-footer button:focus-visible{ outline:2px solid var(--console-accent); outline-offset:2px; }
  /* Back is the secondary action, and there is nothing to go back to on step 1. */
  .console-tour .driver-popover-footer .driver-popover-prev-btn{ border-color: var(--lch-border); background: transparent; color: var(--lch-text-primary); }
  .console-tour .driver-popover-footer .driver-popover-prev-btn.driver-popover-btn-disabled{ visibility:hidden; }
  .console-tour .driver-popover-arrow-side-left.driver-popover-arrow{ border-left-color: var(--lch-bg-pill); }
  .console-tour .driver-popover-arrow-side-right.driver-popover-arrow{ border-right-color: var(--lch-bg-pill); }
  .console-tour .driver-popover-arrow-side-top.driver-popover-arrow{ border-top-color: var(--lch-bg-pill); }
  .console-tour .driver-popover-arrow-side-bottom.driver-popover-arrow{ border-bottom-color: var(--lch-bg-pill); }

  /* ---------------- Case drawer (spec 0002) ----------------
     shadcn's Sheet, retokened for this page: panel background, the page's
     soft borders, 560px wide, full screen on phones (below). */
  /* Dimmed, not blurred: the Cases table stays readable behind the drawer. */
  [data-slot="sheet-overlay"]{ background: rgba(0,0,0,0.45); backdrop-filter:none; -webkit-backdrop-filter:none; }
  .console-case-drawer[data-slot="sheet-content"]{
    width: min(560px, 100%); max-width:none; gap:0;
    background: var(--lch-bg-main); color: var(--lch-text-primary);
    border-left: 1px solid var(--lch-border-soft);
  }
  .case-drawer-header{
    padding: 16px 56px 14px 20px; gap:6px;
    border-bottom: 1px solid var(--lch-border-soft);
  }
  .case-drawer-title{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; letter-spacing:-0.01em; }
  .case-drawer-sub{ font-size:12px; line-height:1.5; color: var(--lch-text-secondary); overflow-wrap:anywhere; }
  .case-drawer-body{ display:grid; align-content:start; grid-auto-rows:max-content; gap:12px; padding:16px 20px 24px; overflow-y:auto; flex:1; min-height:0; }
  .case-banner{
    display:grid; gap:4px; font-size:12.5px; line-height:1.5;
    padding: var(--card-pad-y) var(--card-pad-x); border-radius: var(--radius-md);
    background: var(--sev-high-dim); border: 1px solid rgba(235,87,87,0.3);
  }
  .case-banner-title{ color: var(--sev-high); font-size:13px; font-weight:600; }
  .case-facts{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px 16px; }
  .case-fact dt{ font-size:11.5px; color: var(--lch-text-tertiary); margin-bottom:3px; }
  .case-fact dd{ font-size:12.5px; }
  .case-fact-note{ display:block; margin-top:4px; font-size:11.5px; color: var(--lch-text-secondary); }
  .case-pills{ display:inline-flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .case-stage{ background: var(--lch-bg-panel); border:1px solid var(--lch-border-soft); border-radius: var(--radius-md); overflow:hidden; }
  .case-stage-header{ padding: var(--card-pad-y) var(--card-pad-x); border-bottom:1px solid var(--lch-border-soft); }
  .case-stage-header .card-title{ margin-bottom:2px; }
  .case-stage-header .section-sub{ margin:0; }
  .case-stage-body{ display:grid; gap:12px; padding: var(--card-pad-y) var(--card-pad-x); }
  .case-stage-body .card-copy{ margin-top:0; }
  .case-evidence{ list-style:none; display:grid; gap:10px; }
  .case-evidence-tool{ font-size:12.5px; font-weight:600; margin-bottom:4px; }
  .case-evidence ul{ list-style:none; }
  .case-evidence-item{
    display:grid; gap:4px; font-size:12.5px; padding:8px 10px; border-radius: var(--radius-sm);
    border:1px solid var(--lch-border-soft); scroll-margin:16px;
  }
  .case-evidence-item + .case-evidence-item{ margin-top:6px; }
  .case-evidence-item:focus{ outline:none; }
  .case-evidence-item:focus-visible, .case-evidence-item:focus{ border-color: var(--console-accent); }
  .case-claims{ list-style:none; display:grid; gap:8px; }
  .case-claims li{ display:grid; gap:3px; font-size:12.5px; padding:8px 10px; border-radius: var(--radius-sm); border:1px solid var(--lch-border-soft); }
  .case-claims .td-tertiary{ font-size:11.5px; }
  .case-uncertainties{ padding-left:16px; display:grid; gap:3px; font-size:12px; color: var(--lch-text-secondary); }
  .case-events summary{ cursor:pointer; font-size:11.5px; color: var(--lch-text-tertiary); }
  .case-events summary:hover{ color: var(--lch-text-secondary); }
  .case-events table{ margin-top:8px; }
  .case-events thead th, .case-events tbody td{ padding:7px 8px; font-size:11.5px; }
  .case-events tbody tr:hover{ background:none; cursor:default; }

  @media (max-width: 700px){
    .topbar{ padding:14px 0; }
    .topbar-inner{ align-items:flex-start; flex-wrap:wrap; padding:0 16px; }
    /* Wrap rather than squeeze: the picker keeps a readable width and the
       Live status its words; Run showcase drops to a second row if needed. */
    .topbar-actions{ width:100%; flex-wrap:wrap; }
    .topbar-actions [data-slot="select-trigger"]{ flex:1 1 150px; min-width:0; }
    .tabs{ margin-top:10px; padding:0 16px; overflow-x:auto; }
    .body-grid{ gap:24px; padding:20px 16px; }
    .section-sub{ overflow-wrap:anywhere; }
    .console-summary-grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .console-case-drawer[data-slot="sheet-content"]{ width:100%; border-left:0; }
    .case-drawer-header{ padding:14px 52px 12px 16px; }
    .case-drawer-body{ padding:14px 16px 20px; }
    .case-facts{ grid-template-columns:1fr; }
    .console-summary-grid .stat-tile{ min-height:0; }
    table{ font-size:11px; }
    thead th:nth-child(3), tbody td:nth-child(3){ display:none; }
    .console-outcome-header{ flex-direction:column; gap:12px; }
    .panel-toolbar{ flex-direction:column; align-items:flex-start; gap:10px; }
    .table-card-header{ flex-wrap:wrap; }
    .case-filters{ margin-left:0; width:100%; }
    .console-chart-data thead th:nth-child(3), .console-chart-data tbody td:nth-child(3){ display:table-cell; }
  }
</style>
</head>
