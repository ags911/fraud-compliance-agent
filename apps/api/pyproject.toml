[project]
name = "fraud-compliance-agent-api"
version = "0.1.0"
description = "Streaming demo backend for arbiris-sdk's fraud_compliance_agent_v2 — runs the LangGraph pipeline live and streams per-node progress over SSE."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arbiris[db]",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "groq>=1.4.0",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
arbiris = { path = "vendor/arbiris-sdk", editable = true }

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "plotly>=6.7.0",
    "pytest>=8.0.0",
    "ruff>=0.15.12",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
